[project]
name = "cn-stock-mcp"
version = "2.0.0"
description = "A股数据 MCP 服务，支持多种数据源"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.22",
    "ta-lib>=0.6.8",
    "akshare==1.18.81",
    "numpy>=1.26.0",
    "click>=8.3.1",
    "python-dotenv>=1.2.1",
    "akshare-proxy-patch==0.5.0",
    # Used directly by the direct HTTP channel, not only via akshare-proxy-patch.
    "curl_cffi>=0.7",
    "efinance==0.5.9",
    "playwright>=1.58.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
cn-stock-mcp = "main:main"

[tool.setuptools]
py-modules = ["main", "data"]

# 必须用 find，不能写 packages = ["finmcp"]：显式列表**不带子包**，装出来的
# site-packages/finmcp/ 里只有顶层那几个 .py，datasource/ 整个丢掉，一 import
# 就是 ModuleNotFoundError: No module named 'finmcp.datasource'。
# 本地开发跑的是 `python main.py`（从仓库根目录导入），照不出这个洞——只有
# 装成包再起服务才会炸，2026-09-06 在部署机上就是这么炸的。
[tool.setuptools.packages.find]
include = ["finmcp*"]

[tool.pytest.ini_options]
# 只收 tests/。tests_research/ 是调研脚本目录，里面 33 个文件里有 3 个碰巧叫
# test_*.py，裸跑 pytest 会把它们收进来——而 test_etf.py 顶层就有一行
# akshare_proxy_patch.install_patch("101.201.173.125", ...)，**收集阶段**就会执行：
# 既去连那个代理（积分是要充值的），又把 requests 全进程 patch 掉，让
# tests/test_http_channel.py 的 21 个用例集体判 requests_already_patched。
# 要跑调研脚本就显式写路径。
testpaths = ["tests"]
